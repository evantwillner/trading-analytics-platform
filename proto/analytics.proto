syntax = "proto3";

package analytics.v1;

option csharp_namespace = "TradingAnalytics.Proto.Analytics.V1";

// A single market tick (a simplified "price update").
message Tick {
  string symbol = 1;      // e.g. "AAPL"
  int64 ts_unix_ms = 2;   // timestamp in milliseconds since epoch
  double price = 3;       // last traded price (or mid price in a simplified world)
  int64 size = 4;         // trade size / volume at this tick (optional in real life)
}

// Request for a one-time snapshot.
message GetSnapshotRequest {
  string symbol = 1;
}

// One-time snapshot response.
message GetSnapshotResponse {
  Tick last_tick = 1;
}

// Request to stream ticks for a set of symbols.
message StreamTicksRequest {
  repeated string symbols = 1; // watchlist symbols
}

// Server-streaming response: the server will continuously send Tick messages.
service AnalyticsService {
  rpc GetSnapshot(GetSnapshotRequest) returns (GetSnapshotResponse);
  rpc StreamTicks(StreamTicksRequest) returns (stream Tick);
}
